[rationale]
fit_summary_with_curve = "Reverse-fit from a target rendition (statistical match; the target is not pixel-aligned, so local masks and per-band hue rotation are not recovered): luma-CDF → tone sliders + residual tone curve, chroma → saturation, per-band colour mixer, per-channel cast curves. Residual look error {err_before} → {err_after}."
fit_summary_no_curve = "Reverse-fit from a target rendition (statistical match; the target is not pixel-aligned, so local masks and per-band hue rotation are not recovered): luma-CDF → tone sliders (no residual curve), chroma → saturation, per-band colour mixer, per-channel cast curves. Residual look error {err_before} → {err_after}."
fit_summary_atmosphere = "Reverse-fit Atmosphere mode (structural divergence D={d}): the target's structure cannot be reconstructed by develop controls, so only its atmosphere and overall tone/colour were matched with bounded robust controls. Residual look error {err_before} → {err_after}."
fit_note_pairing_pixel = " Structural reading: D {fine} at pixel scale, {coarse} at layout scale — the pixel-scale reading holds, so this solve paired source pixel with target pixel."
fit_note_pairing_cell = " Structural reading: D {fine} at pixel scale, {coarse} at layout scale — the pixel-scale reading does not hold, so only cell statistics were paired and never individual pixels."
fit_note_mode_margin = " The pixel-scale reading is {margin} from the {line} mode threshold: this pair chose between the full solve and Atmosphere mode by that margin."
fit_note_wb_cells_refused = " A white balance was solved from the population and then rendered and checked against the target's own 12x8 cell means: only {converged} of the frame moved closer, {diverged} moved away, and {aligned} moved in the direction its own target asks for, so it was returned to as-shot rather than shipped on population evidence alone."
fit_note_wb_cells_vouched = " The fitted white balance was checked against the target's own 12x8 cell means before it shipped: {converged} of the frame moved closer to its target, {diverged} moved away, and {aligned} moved in the direction its own target asks for."
fit_note_wb_cells_vouched_at_share = " The fitted white balance shipped at {share} of the solved move: the full move was refused by the target's own 12x8 cell means ({full}), and at this share {converged} of the frame moved closer to its target, {diverged} moved away, and {aligned} moved in the direction its own target asks for."
fit_note_far = " NOTE: the fitted recipe still renders far from the target (residual {err_after}) — this look exceeds what global sliders can express; consider the AI variant itself or a zoned edit."
fit_note_sat_pegged = " Saturation demand exceeded the model cap (±60)."
fit_note_atmosphere_sat_pegged = " Atmosphere-mode saturation demand exceeded its conservative cap (±{cap})."
fit_note_atmosphere_confidence = " Atmosphere-mode confidence is capped at {cap} because develop controls cannot recreate the divergent structure."
fit_note_atmosphere_population_evidence = " Atmosphere controls were read on population evidence; structural withholding of luma ranges [{luma_ranges}] and hue bands [{hue_bands}] applies to the residual, zone and detail fits, not to the bounded atmosphere controls."
fit_note_wb_clamped = " White balance was clamped into the strength budget (gain ratio {from} to {to}, rotated share {rotated_share} over {coverage} of the frame); the requested cast exceeded the honest range."
fit_note_wb_withheld_foreign_hue = " White balance withheld: it would paint hues the target does not contain."
fit_note_wb_withheld_rotation = " White balance withheld: rotated share {rotated_share} over {coverage} of the frame exceeded the strength budget."
fit_note_wb_search_bound = " White balance search reached the {k} K domain bound; the requested colour temperature may lie beyond the fitted range."
fit_note_cast_admitted_by_strength = " Colour-cast curves were admitted by the strength budget (measured ratio {ratio}, budget {budget})."
fit_note_cast_admitted = " Colour-cast curves were admitted: the look error with the curves is {ratio} of the error without them (the strength budget's bound is {bound}), and they re-hued {rehued} of the frame past the rotation budget."
fit_note_cast_admitted_foreign = " They created {foreign} of the frame in hues the target does not contain."
fit_note_cast_admitted_foreign_na = " The foreign-hue share was not measurable: the target carries too little colour to say which hues are foreign to it."
fit_note_cast_admitted_fan = " They changed the widest hue class's hue spread across luminance by {fan} degrees, against a limit of {limit} (a negative value means they narrowed it)."
fit_note_cast_admitted_fan_na = " The hue fan was not measurable: no hue class holds enough of the frame across two luma slices for a fan to have a value."
fit_note_cast_hue_fanned = " Colour-cast curves were withheld: they would have fanned one hue class apart across luminance — that class holds {share} of the frame's measurable colour, and the three channel curves would have spread its dark and bright slices {fan} degrees apart (limit {limit}). Shrinking them — first toward the one shape all three channels share, then toward no curves at all — was tried first: either no point on that path cleared the limit, or the best-paying point that did bought less than the fit's own quantisation budget, so none shipped. A single-hued region sorted into a hue fan by brightness is not something any develop control can put back."
fit_note_cast_projected = " Colour-cast curves were shrunk toward the shape all three channels share: as fitted they would have opened a {fan_before} degree hue fan in a class holding {share} of the frame's measurable colour (limit {limit}), so they were taken back to t = {t} of the fitted cast (1 = as fitted, 0.5 = one curve shared by all three channels, 0 = none). The look error with the shrunk curves is {ratio} of the error without them (the strength budget's bound is {bound}), and they re-hued {rehued} of the frame past the rotation budget."
fit_note_cast_projected_fan = " The projected curves change that class's hue spread across luminance by {fan_after} degrees, inside the {target} degree target a projection has to reach."
fit_note_cast_projected_fan_na = " The projected curves' hue fan was not measurable: no hue class holds enough of the frame across two luma slices for a fan to have a value."
fit_note_delivered_fan = " The finished recipe was read once more against the untouched photo: it sorted one hue class apart across luminance — that class holds {share} of the frame's measurable colour and its dark and bright slices ended {fan} degrees apart, against a limit of {limit} — so the colour-cast curves were taken back out, which brings that class inside the limit."
fit_note_delivered_fan_uncaused = " The finished recipe was read once more against the untouched photo: it sorted one hue class apart across luminance — that class holds {share} of the frame's measurable colour and its dark and bright slices ended {fan} degrees apart, against a limit of {limit}. Taking the colour-cast curves back out still left {after} degrees, so they were not the cause and they were kept; tone and saturation are what spread that class, and no develop control puts a brightness-sorted hue fan back."
fit_note_cast_handed_to_wb = " Colour cast handed to the white balance: as fitted on top of {k_before} K / tint {tint_before} the channel curves would have opened a {fan_before} degree hue fan in a class holding {share} of the frame's measurable colour (limit {limit}), so the white balance was searched along the direction those curves pull and moved to {k_after} K / tint {tint_after}, where the curves re-fitted on top of it read {fan_after} degrees on the same census and ship whole. The target's own 12x8 cell means vouched the moved white balance: {converged} of the frame moved closer, {diverged} moved away, and {aligned} moved in the direction its own target asks for."
fit_note_global_cast = " Global colour cast measured from consistent hue rotation across the populated frame (rotation {rotation} degrees, chroma ratio {ratio}); white balance and saturation were read from population evidence."
fit_note_veto_disclosed = " High-strength fit disclosed unsupported movement in {kind}: {ranges}. The controls were retained, but confidence is capped by the strength budget."
fit_note_strength = " Reverse-fit strength {pct}% set how far weak evidence could move the sliders."
fit_degenerate = " Fit refused: the source or target frame has no tonal variation (blank or single-tone), so a statistical match would produce a constant tone map — no recipe was fitted."
fit_note_tone_withheld_harm = " The tone sliders were withheld: rendered, they left the frame's tones farther from the target's than the untouched source's (tonal reading {before} → {after}), so the tone stage shipped nothing and the stages after it solved from the untoned frame."
fit_note_curve_withheld_harm = " The residual tone curve was withheld: rendered on top of the sliders it left the frame's tones farther from the target's (tonal reading {before} → {after}), so the sliders ship without it."
fit_note_regressed = " The full fit rendered farther from the target than the untouched source at every saturation level — returning a NEUTRAL recipe (do-no-harm terminal case); this look is outside the global model's reach."
fit_note_sat_reduced = " Saturation was pulled back from the chroma-matched {sat_fitted} to {sat_now} after the full-strength fit rendered farther from the target than the untouched source (do-no-harm check)."
fit_note_rehue_blocked = " Colour-cast curves were withheld: they would have re-hued a region of the frame (pixel-aligned hue-damage gates)."
fit_note_cast_rejected = " The colour stage produced NOTHING: the per-channel cast curves it fitted did not improve the look by a clear enough margin to earn the risk of dragging every region, so they were rejected and this fit carries tone and saturation only."
fit_note_joint = " Joint distribution check (luminance × chroma value ranges, {n} of them carried evidence on both sides): area-weighted mismatch {weighted}, worst range {worst} in {label}. These are VALUE ranges, not areas of the picture — their pixels are spread over the whole frame."
fit_note_joint_none = " (the joint distribution check found no value range with enough evidence on both sides, so it has no opinion on this pair; confidence remains capped by the pair's shared-evidence identifiability)"
fit_note_joint_miss = " The fit tried the supported controls but did not reach the target: the two images still differ inside matching value ranges, which the single residual number above cannot show; treat this fit as a starting point, not a match."
fit_note_joint_refused = " The fit withheld supported movement because the evidence was one-sided, so this result is deliberately farther from the target; this is a refusal, not a miss."
fit_note_joint_regressed = " (the refusal came from the joint distribution check, not the residual: the fitted recipe pushed the value ranges further apart than leaving the photo alone)"
fit_note_evidence_contradicted = " Fit refused because the evidence contradicted the proposed correction: the measurable value ranges moved farther apart, so the recipe was reset to the untouched calibration."
fit_note_evidence_unmeasurable = " Fit withheld because nothing measurable was available here: no shared value range had enough evidence on both sides, so no correction was fitted."
fit_note_unrepresented = " This target's look appears to use more {controls} than the reverse-fit could ship (its solution space is exposure/contrast/highlights/shadows/whites/blacks, white balance, a tone curve, one global saturation, clarity/texture, the colour-grade wheels, an evidence-gated per-band colour mixer whose hue is read from paired pixels only, and the three channel curves, each shipping only what its evidence admits) — that part of the look cannot arrive through this route."
fit_note_atmosphere_unrepresented = " This target's remaining look appears to need {controls}; Atmosphere mode only solves bounded exposure, white balance, a robust five-point tone curve, saturation, an evidence-gated per-band colour mixer that never rotates hue, and evidence-gated clarity/texture, so that part cannot arrive through this route."
fit_note_deep_adopted = " Deep reverse-fit: the visual reviewer scored the plain solve {score1}/100, so one guided retry was bought ({action}); it re-scored {score2}/100 and was kept (a lower score would have been discarded)."
fit_note_not_same_frame = " WARNING: the reference's proportions do not match this photo's — it was CROPPED, or it is not the same frame. Either way the two distributions are not comparable, because a crop changes which pixels the statistics are taken over. The fit matched them anyway, as it was asked to — treat the result as unreliable."
fit_summary_with_curve_paired = "Reverse-fit from a target rendition (paired robust match on corresponding pixels; local masks are still not solved; per-band hue rotation is solved from the paired pixels): robust paired luma regression → tone sliders + residual tone curve, chroma → saturation, per-band colour mixer, per-channel cast curves. Residual look error {err_before} → {err_after}."
fit_summary_no_curve_paired = "Reverse-fit from a target rendition (paired robust match on corresponding pixels; local masks are still not solved; per-band hue rotation is solved from the paired pixels): robust paired luma regression → tone sliders (no residual curve), chroma → saturation, per-band colour mixer, per-channel cast curves. Residual look error {err_before} → {err_after}."
fit_note_robust_rejected = " Paired robust fit: {pct}% of the comparable pixels disagreed with any single global develop of this source (concentrated in [{ranges}]) and were down-weighted before the controls were solved."
zone_robust_rejected = " Zoned {label} robust fit down-weighted {pct}% of the overlapping pixels as content the two zones do not share (concentrated in [{ranges}])."
fit_note_vouched_convergence = " Paired convergence carried movement through one-sided hue bands [{bands}]: each moved pixel was individually vouched (robust weight, hue-coherent with the global edit) and moved toward its own paired target pixel; unvouched pixels kept the veto."
fit_note_cast_cells_vouched = " The region's own cells carried movement through one-sided hue bands [{bands}]: those pixels are re-synthesised and have no paired counterpart, so admission was asked of the target's 12x8 cell means instead — {converged} of the frame moved closer, {diverged} moved away, and {aligned} moved in the direction its own target asks for. Pixels in cells that did not converge kept the veto."
fit_note_evidence_withheld = " Evidence gating withheld luma ranges [{luma_ranges}] and hue bands [{hue_bands}]. One-sided [{one_sided}] is UNMEASURABLE, not equal, so it vetoed movement. Sparse on both sides [{sparse}] was excluded from estimation but did not veto a move. Structurally divergent [{divergent}] also vetoed movement."
fit_note_detail = " Detail evidence fitted clarity {clarity} and texture {texture} within the +/-20 budget; their high-frequency reading used only identifiable pixels."
fit_note_detail_withheld = " Detail controls were withheld: two-sided structural and luma-range evidence did not support a safe global detail move, so clarity and texture were not moved."
fit_note_hsl_bands = " Per-band colour mixer: saturation and luminance solved from each band's own population, hue from the paired pixels' own rotation where the target's cells vouch it: [{moved}]. Bands left neutral for want of two-sided population evidence: [{refused}]."
fit_note_hsl_bands_vouched = " Hue bands [{bands}] were one-sided on the pair as it arrived and are two-sided on the render this stage solved from; the target's own cell means vouched that the earlier stages moved those pixels toward it, so the bands were admitted rather than left neutral."
fit_note_color_grade = " The colour grade carries the part of the paired colour change that differs by brightness, which no white balance can: shadows {shadows}, midtones {midtones}, highlights {highlights}."
