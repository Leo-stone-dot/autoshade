zone_subzones_regressed = " 区域 {label} 保留现有配方：{k} 段试算回退或未通过门控（{reason}，{trials} 次试算）；R2={r2}，分界={breaks}，重叠={overlap}，色差 {before} → {after}，边界 {seam_before} → {seam_after}，目标边界 {step_before} → {step_after}，最差单元回退 {regression}。"
zone_pairing_scale = " 分区 {label} 的影调按单元尺度求解：该分区自身的结构读数为 {d}，已越过 {line} 的配对界线，其像素与目标像素并非逐一对应 —— 影调取自该分区自身的亮度分布，而不是逐像素回归，后者会把重新合成的纹理的对比度读低。"
