zone_mode_atmosphere = " {label} 结构无法通过配方恢复，只匹配氛围（D={d}）。"
zone_quality_passed = " {label} 区已通过局部质量门：纹理比 {texture}，裁切占比 {clip_before}% → {clip_after}%。"
