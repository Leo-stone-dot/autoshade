detail_attached = " 已为 {label} 区匹配局部对比度：纹理 {texture}、清晰度 {clarity}（取解出值的 {k}）。目标的结构与本图在纹理尺度上的配对相关 r={r_tex}、清晰度尺度 r={r_cla}；渲染的局部对比度在纹理尺度上从目标的 {tex_before} 到 {tex_after}，在清晰度尺度上从 {cla_before} 到 {cla_after}。"
detail_unpaired = " {label} 区的局部对比度未动：目标的细节结构与本图对不上位置（纹理尺度配对相关 r={r_tex}、清晰度尺度 r={r_cla}，门线 {min}）。滑块只能放大照片里已有的东西，目标在那里显示的是画上去的，不是显影出来的。"
detail_already_matched = " {label} 区的局部对比度已经匹配（配对相关 r={r_tex}/{r_cla}；目标在纹理尺度上要求渲染结构的 {beta_tex} 倍、清晰度尺度 {beta_cla} 倍）。"
detail_not_on_structure = " {label} 区的局部对比度没动：目标在纹理尺度上显示本图对比度的 {ratio_tex} 倍、清晰度尺度 {ratio_cla} 倍，但在两图共有的结构上（配对相关 r={r_tex}/{r_cla}）只要求 {beta_tex} 倍和 {beta_cla} 倍——差别不在本图的结构上，滑块加不上去。"
detail_no_structure = " {label} 区未量局部对比度：两边在那里都没有可配对的细节结构。"
detail_refused_quality = " {label} 区的局部对比度匹配被局部质量门拒绝，收缩阶梯每一档都没过（解出纹理 {texture}、清晰度 {clarity}；配对相关 r={r_tex}/{r_cla}）。"
detail_refused_energy = " {label} 区的局部对比度匹配被拒绝：收缩阶梯每一档都会把某个尺度的局部对比度推过证据允许的上限——结构配对的尺度以目标为限，不配对的尺度以本图原有的为限（解出纹理 {texture}、清晰度 {clarity}；配对相关 r={r_tex}/{r_cla}）。"
detail_refused_frame = " {label} 区的局部对比度匹配被拒绝：收缩阶梯每一档都让整幅画面超出漂移预算（解出纹理 {texture}、清晰度 {clarity}；配对相关 r={r_tex}/{r_cla}）。"
detail_refused_reach = " {label} 区的局部对比度匹配被拒绝：滑块已推到头（纹理 {texture}、清晰度 {clarity}），渲染在该尺度的局部对比度仍只有目标的 {share}——目标在那里显示的对比度不是这个滑块能做出来的（配对相关 r={r_tex}/{r_cla}）。"
zone_share_no_correction = " 未附加任何分区修正：源图与目标的分区占比之比超过 2:1，两侧不是对同一主体的可比测量。"
zone_boundary_passed = " 分区边界连续性门保留了 {n} 个分区校正：共享差异收缩 k={k} 后，引入的过渡边缘亮度由 {before} 变为 {after}，其中目标自身边界要求 {asked}；未要求部分的语境计费读数 {charged}，色彩读数 {colour}、计费后 {colour_charged}（上限 {max}，测量了 {transitions} 个过渡）。"
zone_boundary_inert = " {n} 个分区校正被边界连续性门弃用：候选引入的边缘亮度为 {before}，而上限 {max} 之内最大的收缩为 k={k}，其渲染结果与不含该校正的画面逐字节相同——亮度读数为 {after}（语境计费读数 {charged}，色彩读数 {colour}、计费后 {colour_charged}），测量了 {transitions} 个过渡。无效的附加会占用校正预算，并报告一项它其实没有做出的改动。"
zone_shrunk_refused = " {label} 校正在边界收缩到 k={k} 之后被拒绝：按该强度，其自身残差为 {after}，同一画面去掉它时为 {before}，画面 {frame_before} -> {frame_after}；收缩后的校正只有在不让自身区域变差、画面不超出允许漂移时才会发出。"
zone_boundary_dropped = " 分区校正被边界连续性门弃用：候选边缘亮度为 {before}，且共享收缩 k=0 时仍为 {after}（语境计费读数 {charged}，色彩读数 {colour}、计费后 {colour_charged}，上限 {max}，测量了 {transitions} 个过渡）。"
zone_attached = " 已附加 {label} 区校正（{label} 对 {label} 矩 → 局部曝光 {ev} EV、色彩增益 [{g0} {g1} {g2}]、饱和度 {sat}）：区残差 {before} → {after}。该校正是位图蒙版——仅应用内渲染；Lightroom 边车只携带全局拟合（经典 XMP 无法承载栅格蒙版）。"
zone_attached_ai = " 已附加 {label} 区校正（{label} 对 {label} 矩 → 局部曝光 {ev} EV、色彩增益 [{g0} {g1} {g2}]、饱和度 {sat}）：区残差 {before} → {after}。该校正以 Lightroom 自有的「选择天空」蒙版写入边车——Lightroom 自行重建天空 alpha；此处的栅格由本机渲染，非 Adobe 原栅格。"
zone_share_mismatch = " 注：{label} 区占原图 {s}% 而占目标图 {t}%——两者构图不同，整体分布残差停留在全局拟合的水平。"
zone_dropped = " 已弃用 {label} 区校正：区残差 {before} → {after}（需 ≤ 原值的 {ratio}%，或 ≤ {floor} 同时增益 ≥ {gain}%），全画面漂移 {drift}（容差 {tol}）。"
zone_atmosphere_dropped = " 已弃用 {label} 区氛围校正：区残差 {before} → {after} 未通过不伤害原则，或全画面漂移 {drift} 超出容差 {tol}。"
