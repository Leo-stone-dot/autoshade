[rationale]
fit_summary_with_curve = "从目标成品反推（统计匹配；目标未像素对齐，故局部蒙版与分色相的色相旋转无法恢复）：亮度 CDF → 影调滑杆 + 残差影调曲线，色度 → 饱和度，逐色带颜色混合器，逐通道色偏曲线。剩余观感误差 {err_before} → {err_after}。"
fit_summary_no_curve = "从目标成品反推（统计匹配；目标未像素对齐，故局部蒙版与分色相的色相旋转无法恢复）：亮度 CDF → 影调滑杆（无残差曲线），色度 → 饱和度，逐色带颜色混合器，逐通道色偏曲线。剩余观感误差 {err_before} → {err_after}。"
fit_summary_atmosphere = "反推氛围模式（结构差异 D={d}）：目标结构无法通过显影控制恢复，因此仅以有界的可靠控制匹配其氛围和整体影调/色调。剩余观感误差 {err_before} → {err_after}。"
fit_note_pairing_pixel = " 结构读数：像素尺度 D {fine}，布局尺度 {coarse}——像素尺度读数成立，因此本次求解按源像素对目标像素配对。"
fit_note_pairing_cell = " 结构读数：像素尺度 D {fine}，布局尺度 {coarse}——像素尺度读数不成立，因此只配对单元统计量，不配对单个像素。"
fit_note_mode_margin = " 像素尺度读数距离 {line} 的模式阈值只有 {margin}：本组图像就是以这个差值在完整求解与氛围模式之间做的选择。"
fit_note_wb_cells_refused = " 已从整体证据求解出一次白平衡，渲染后按目标自身的 12x8 单元均值比对：只有 {converged} 的画面更接近目标，{diverged} 反而远离，{aligned} 的移动方向与各自目标要求的方向一致，因此退回相机原始值，不以整体证据独自发布。"
fit_note_wb_cells_vouched = " 拟合出的白平衡在发布前已按目标自身的 12x8 单元均值比对：画面的 {converged} 更接近目标，{diverged} 反而远离，{aligned} 的移动方向与各自目标要求的方向一致。"
fit_note_wb_cells_vouched_at_share = " 拟合出的白平衡按求解移动的 {share} 发布：完整移动被目标自身的 12x8 单元均值拒绝（{full}），按此份额则画面的 {converged} 更接近目标，{diverged} 反而远离，{aligned} 的移动方向与各自目标要求的方向一致。"
fit_note_far = " 注意：拟合配方的渲染结果仍与目标相距较远（残差 {err_after}）——此风格超出全局滑杆的表达范围；可考虑直接使用 AI 变体或分区编辑。"
fit_note_sat_pegged = " 饱和度需求超出模型上限（±60）。"
fit_note_atmosphere_sat_pegged = " 氛围模式的饱和度需求超出其更低上限（±{cap}）。"
fit_note_atmosphere_confidence = " 由于显影控制无法重建差异结构，氛围模式的置信度上限为 {cap}。"
fit_note_atmosphere_population_evidence = " 氛围控制依据整体证据读取；结构性保留的明度范围 [{luma_ranges}] 和色相带 [{hue_bands}] 仅适用于残差、区域和细节拟合，不适用于有界氛围控制。"
fit_note_wb_clamped = " 白平衡已限制在强度预算内（增益比 {from} 至 {to}，色相旋转份额 {rotated_share}，覆盖画面 {coverage}）；请求色偏超出范围。"
fit_note_wb_withheld_foreign_hue = " 白平衡已保留：目标没有这些色相。"
