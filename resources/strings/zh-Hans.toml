fit_note_cast_hue_fanned = " 色偏曲线已被扣留：它们会把同一个色相类沿亮度拉散——该色相类占画面可测色彩的 {share}，而三条通道曲线会把它的暗部与亮部切片拉开 {fan} 度（上限 {limit}）。先尝试过把它们收缩——先收向三个通道共有的那一个形状，再收向完全不加曲线：这条路上没有任何一点进入上限之内，或者进入上限之内改进最大的那一点带来的改进也不足拟合自身的量化预算，于是一条也没有采用。单一色相的区域被按明暗分选成多个色相，任何显影控件都无法还原。"
fit_note_cast_projected = " 色偏曲线已向三个通道共有的形状收缩：按拟合原样，它们会在占画面可测色彩 {share} 的色相类内拉开 {fan_before} 度的色相跨度（上限 {limit}），因此把它们收缩到拟合值的 t = {t}（1 = 原样，0.5 = 三个通道共用一条曲线，0 = 不加曲线）。加上收缩后曲线的观感误差与不加曲线时的比值为 {ratio}（强度预算的上限为 {bound}），并使画面的 {rehued} 超出色相旋转预算。"
fit_note_cast_projected_fan = " 收缩后的曲线把该色相类沿亮度的色相跨度改变了 {fan_after} 度，在收缩需要达到的 {target} 度目标之内。"
fit_note_cast_projected_fan_na = " 收缩后曲线的色相沿亮度跨度无法测量：任何色相类都没有在两个亮度切片上占到足够的画面。"
fit_note_delivered_fan = " 成品配方再对照未处理的原片读了一次：它把同一个色相类沿亮度分选开了——该色相类占画面可测色彩的 {share}，其暗部与亮部切片最终相差 {fan} 度，上限为 {limit}——因此把色偏曲线重新取了出来，这使该色相类回到上限之内。"
fit_note_delivered_fan_uncaused = " 成品配方再对照未处理的原片读了一次：它把同一个色相类沿亮度分选开了——该色相类占画面可测色彩的 {share}，其暗部与亮部切片最终相差 {fan} 度，上限为 {limit}。把色偏曲线取出来之后仍有 {after} 度，说明起因不是这些曲线，于是把它们保留了下来；把该色相类拉散的是影调与饱和度，而任何显影控件都无法把按明暗分选出来的色相跨度还原。"
fit_note_cast_handed_to_wb = " 色偏已交还白平衡：在 {k_before} K / 色调 {tint_before} 之上按拟合原样，通道曲线会在占画面可测色彩 {share} 的色相类内拉开 {fan_before} 度的色相跨度（上限 {limit}），因此沿这些曲线所拉的方向重新求解白平衡，移到 {k_after} K / 色调 {tint_after}；在其之上重新拟合的曲线在同一普查上读数为 {fan_after} 度，全额发布。移动后的白平衡已按目标自身的 12x8 单元均值担保：画面的 {converged} 更接近目标，{diverged} 反而远离，{aligned} 的移动方向与各自目标要求的方向一致。"
fit_note_global_cast = " 已从画面中各色相带一致的色相旋转测得全局色偏（旋转 {rotation} 度，色度比 {ratio}）；白平衡和饱和度取自整体证据。"
fit_note_veto_disclosed = " 高强度拟合显示 {kind} 中没有双侧证据的移动：{ranges}。控制保留，置信度受强度预算限制。"
fit_note_strength = " 反推强度 {pct}% 决定了证据不足时滑杆可移动的幅度。"
