zone_evidence_withheld_colour = " 分区 {label} 的色彩控件暂不调整：它们会移动零证据的色相 [{hue_bands}]，因此未盲目调整。"
zone_evidence_withheld_tone = " 分区 {label} 的影调控件暂不调整：它们会移动零证据的亮度范围 [{luma_ranges}]，因此未盲目调整。"
zone_evidence_withheld_colour_cells = " 分区 {label} 的色彩控件暂不调整：它们会移动零证据的色相 [{hue_bands}]，而该区域的像素与目标像素并非逐一对应，于是改由目标自身的 12x8 单元均值裁定 —— 也没有为这次移动担保（{cells}），因此未盲目调整。"
zone_evidence_withheld_tone_cells = " 分区 {label} 的影调控件暂不调整：它们会移动零证据的亮度范围 [{luma_ranges}]，而该区域的像素与目标像素并非逐一对应，于是改由目标自身的 12x8 单元均值裁定 —— 也没有为这次移动担保（{cells}），因此未盲目调整。"
zone_colour_vouched_by_cells = " 分区 {label} 的色彩控件按区域证据发布：像素尺度的读数因该区域纹理是重新合成的而暂不调整色相 [{hue_bands}]，于是把这次移动渲染出来，交由目标自身在该分区上的 12x8 单元均值裁定 —— 区域的 {converged} 更接近目标，{diverged} 反而远离，{aligned} 的移动方向与各自目标要求的方向一致。"
zone_tone_vouched_by_cells = " 分区 {label} 的影调控件按区域证据发布：像素尺度的读数因该区域纹理是重新合成的而暂不调整亮度范围 [{luma_ranges}]，于是把这次移动渲染出来，交由目标自身在该分区上的 12x8 单元均值裁定 —— 区域的 {converged} 更接近目标，{diverged} 反而远离，{aligned} 的移动方向与各自目标要求的方向一致。"
zone_colour_vouched_by_pixels = " 分区 {label} 的色彩控件按配对证据发布，穿过单侧色相带 [{hue_bands}]：该区域的像素与目标像素逐一对应，每个被移动的像素都逐一获得担保（稳健权重），并向其自身的配对目标像素靠近；未获担保的像素维持否决。"
zone_tinted = " 分区 {label} 向 {hue}° 做颜色染色，强度 {amount}：由 {n} 个配对像素读出，其中 {neutral} 个是中性像素，云和天空一起读——把每个像素的色度向同一色相推一次，中间调推得最多、明暗不动，让分区里中性与有色像素一起落到目标上，而按分区均值求出的分通道增益会把这两类像素推向两边。单侧色相段 [{hue_bands}] 没有否决它，因为它的色相和强度是从这些色段两侧的配对像素一起读出的；它和所有颜色调整一样通过了画质、验收与边界门，并因逐像素更接近目标而取代了普通的颜色求解。"
zone_colour_vouched_at_share = " 分区 {label} 的色彩控件按区域证据、以求解移动的 {share} 份额发布：像素尺度的读数暂不调整色相 [{hue_bands}]，完整移动被目标自身的 12x8 单元均值拒绝（{full}），按此份额区域的 {converged} 更接近目标，{diverged} 反而远离，{aligned} 的移动方向与各自目标要求的方向一致。"
zone_tone_vouched_at_share = " 分区 {label} 的影调控件按区域证据、以求解移动的 {share} 份额发布：像素尺度的读数暂不调整亮度范围 [{luma_ranges}]，完整移动被目标自身的 12x8 单元均值拒绝（{full}），按此份额区域的 {converged} 更接近目标，{diverged} 反而远离，{aligned} 的移动方向与各自目标要求的方向一致。"
tile_mask_carrier = " 空间块 {id} 使用 {carrier}：细化的最大权重变化 {delta}，渲染变化 {rendered}，原始单元残差 位图/原生 {fidelity}。"
zone_subzones_attached = " 区域 {label} 在 {trials} 次试算后接受 {k} 段：残差 R2={r2}，分界={breaks}，重叠={overlap}，色差 {before} → {after}，边界 {seam_before} → {seam_after}，目标边界 {step_before} → {step_after}，最差单元回退 {regression}。"
