fit_note_regressed = " 全强度拟合在每个饱和度档位上都比未处理原图离目标更远——返回中性配方（不伤害原则的终止情形）；此风格在全局模型能力之外。"
fit_note_sat_reduced = " 饱和度已从色度匹配的 {sat_fitted} 回撤至 {sat_now}：全强度拟合的渲染结果比未处理原图离目标更远（不伤害检查）。"
