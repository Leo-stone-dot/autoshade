fit_note_not_same_frame = " 警告：参考图与本图的比例不一致——它被裁切过，或者不是同一张。两者都会让两边的分布无法相比，因为裁切会改变统计所覆盖的像素。反推仍按要求做了匹配——结果请视为不可靠。"
fit_summary_with_curve_paired = "从目标成品反推（对应像素稳健配对匹配；局部蒙版仍不解算；分色相的色相旋转按成对像素解算）：稳健配对亮度回归 → 影调滑杆 + 残差影调曲线，色度 → 饱和度，逐色带颜色混合器，逐通道色偏曲线。剩余观感误差 {err_before} → {err_after}。"
fit_summary_no_curve_paired = "从目标成品反推（对应像素稳健配对匹配；局部蒙版仍不解算；分色相的色相旋转按成对像素解算）：稳健配对亮度回归 → 影调滑杆（无残差曲线），色度 → 饱和度，逐色带颜色混合器，逐通道色偏曲线。剩余观感误差 {err_before} → {err_after}。"
fit_note_robust_rejected = " 配对稳健拟合：{pct}% 的可比像素与本源图的任何单一全局显影都不一致（集中在 [{ranges}]），已在求解控件前降权。"
zone_robust_rejected = " 分区 {label} 稳健拟合将 {pct}% 的重叠像素降权：两区并不共有这部分内容（集中在 [{ranges}]）。"
fit_note_vouched_convergence = " 配对收敛携带移动穿过单侧色相带 [{bands}]：每个被移动的像素都逐一获得担保（稳健权重、与全局编辑色相相干），并向其自身的配对目标像素靠近；未获担保的像素维持否决。"
fit_note_cast_cells_vouched = " 由区域自身的单元担保像素穿过单侧色相带 [{bands}]：这些像素是重新合成的，没有可配对的对应像素，因此改由目标自身的 12x8 单元均值裁定准入 —— 画面的 {converged} 更接近目标，{diverged} 反而远离，{aligned} 的移动方向与各自目标要求的方向一致。未收敛单元内的像素仍保留否决。"
fit_note_evidence_withheld = " 证据门控暂不调整亮度 [{luma_ranges}] 和色相 [{hue_bands}]，单侧范围 [{one_sided}] 无法测量，两侧证据稀疏 [{sparse}]，结构差异范围 [{divergent}] 也被阻止。"
fit_note_detail = " 细节证据在 +/-20 限额内拟合了清晰度 {clarity} 和纹理 {texture}；高频测量仅使用可识别像素。"
fit_note_detail_withheld = " 细节控制暂不调整：两侧结构与亮度范围的证据不足，因此未移动清晰度与纹理。"
fit_note_hsl_bands = " 逐带颜色混合器：饱和度与明度按各色带自身的人口统计求解，色相按成对像素自身的旋转求解（须经目标自身的单元格担保）：[{moved}]。因两侧人口证据不足而保持中性的色带：[{refused}]。"
fit_note_hsl_bands_vouched = " 色相带 [{bands}] 在图像对进入时是单侧的，而在本阶段求解所依据的渲染上已是双侧；目标自身的单元均值担保了先前各阶段已把这些像素推向目标，因此这些带被采用，而非保持中性。"
fit_note_color_grade = " 颜色分级承担了配对颜色变化中随亮度而不同的部分，这是任何白平衡都做不到的：阴影 {shadows}，中间调 {midtones}，高光 {highlights}。"
fit_note_color_grade_held = " 颜色分级被限制在当前强度的上限：每个色轮饱和度 {ceiling}；成对像素要求的最大值为 {asked}。调高反推强度可让它走得更远。"
fit_note_hsl_withdrawn_error = " 逐带颜色调整已交还：应用后画面并未更接近目标，因此所有色带恢复中性。"
fit_note_hsl_withdrawn_blind = " 逐带颜色调整已交还：它会让像素穿过没有两侧证据覆盖的色相带，盲目移动会被否决而不会交付。"
fit_atmosphere_reference_population = " 氛围模式的白平衡与曝光解自两侧的整帧逐通道加权中位数。这是把两张画面当作分布来配对，其前提是两侧描述同一批内容——而正是因为该前提不成立，才选用了这个模式。"
fit_atmosphere_reference_unpaired = " 在该参照人口中，目标画面有 {share}% 在源图中没有可信对应（跨图对应低于 {tau}，读自侧车的 {grid} 网格，故为粗粒度占比）——它们同样参与了上面两项控件的定义。"
fit_atmosphere_reference_excluded = " 在整帧参照人口中，目标画面有 {share}% 在源图中没有可信对应（跨图对应低于 {tau}，读自侧车的 {grid} 网格，故为粗粒度占比）——这部分已被排除在上面两项控件之外，而不是任其参与定义。"
fit_atmosphere_reference_shared = " 氛围模式的白平衡与曝光解自两帧的「共有内容」人口，而非整帧：目标中没有任何可信源像素为之作答的像素是生成内容，并非本帧的一种呈现；源中被目标替换掉的像素则已无物可比（任一侧跨图对应低于 {tau}）——两者都在读取逐通道加权中位数之前被剔除。余下源证据质量的 {src}% 与目标证据质量的 {tgt}%，被配对的这两个分布现在描述的是同一批内容。"
fit_atmosphere_reference_thin = " 本可取而代之的共有内容人口只保留了源证据质量的 {src}% 与目标证据质量的 {tgt}%，低于一个人口要被当作人口来读所需的 {floor}%——因此上面的整帧中位数继续成立，其配对假设亦然。"
fit_atmosphere_reference_unmeasured = " 该参照人口中有多少在源图中没有对应，本次未测量：这一对没有可用的跨图对应场。"
fit_correspondence = " 跨图对应已测量（DIFT）：画面 {cov}% 在目标中有可信对应（中位置信 {med}）；完整区拟合按其为像素对加权，并在对应位置读取被移动的内容。"
