fit_note_cast_rejected = " 色彩环节什么也没有产出：它拟合出的逐通道色偏曲线对观感的改进幅度不明显，不值得让整幅画面的每个区域都被拖动，因此被拒绝——本次反推只有影调与饱和度。"
