# Cross-platform build and document verification. `build` proves both feature
# configurations compile on Linux/macOS; `docs` checks the living documents,
# text resources and embedded font coverage.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The doc-drift gate (user ruling 2026-10-02, after a sweep found nine facts
  # the code had moved past): every path, code symbol, link and tier count the
  # living documents name must exist in the tree. Standard library only, so it
  # runs before any compiler is installed.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: doc drift
        run: python3 scripts/check_doc_drift.py
      - name: text resources
        run: python3 scripts/check_text.py
      - name: document claims
        run: python3 scripts/check_docs.py
      - name: GUI font subsets
        run: |
          python3 -m pip install --quiet fonttools
          python3 scripts/subset_gui_fonts.py --check
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
      # A45: the repo pins its compiler (`rust-toolchain.toml`), and `rustup`
      # honours that file for every `cargo` call below whatever the action
      # installed (its `toolchain: stable` input only exists because a commit
      # ref cannot name a channel the way `@stable` did). Asserted rather than
      # assumed — an unpinned runner building the published binaries is
      # exactly the drift the pin exists to end.
      - name: Toolchain
        shell: bash
        run: |
          want=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          got=$(rustc --version | cut -d' ' -f2)
          echo "rust-toolchain.toml pins $want; rustc reports $got"
          test "$want" = "$got" || { echo "::error::the pin was not honoured"; exit 1; }
      - name: cargo build (default features)
        run: cargo build --release --locked
      - name: cargo build (gui feature)
        run: cargo build --release --locked --bins --features gui
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
      - name: Toolchain
        shell: bash
        run: |
          want=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          got=$(rustc --version | cut -d' ' -f2)
          echo "rust-toolchain.toml pins $want; rustc reports $got"
          test "$want" = "$got" || { echo "::error::the pin was not honoured"; exit 1; }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: test policy
        run: |
          python3 scripts/check_test_policy.py --self-test
          python3 scripts/check_test_policy.py
      - name: cargo test (default features)
        run: cargo test --locked --release
      - name: cargo test (GUI workflow)
        run: cargo test --locked --release --features gui --bin autoshade-gui
      - name: HTTP resource boundaries and recovery
        run: scripts/http_resource_battery.sh
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Mutation gate (changed code)
        shell: bash
        run: |
          git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" > /tmp/autoshade-change.diff
          python3 scripts/mutation_gate.py --in-diff /tmp/autoshade-change.diff --jobs 2 --in-place
